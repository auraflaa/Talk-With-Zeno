<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Talk with Zeno</title>
    
    <!-- Fonts: Inter & Bricolage Grotesque -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Suppress Tailwind CDN production warning -->
    <script>
      if (window.console && window.console.warn) {
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) {
            return; // Suppress Tailwind CDN warning
          }
          originalWarn.apply(console, args);
        };
      }
    </script>
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Bricolage Grotesque"', 'sans-serif'],
            },
            colors: {
              base: {
                100: 'var(--bg-primary)',
                200: 'var(--bg-secondary)',
                content: 'var(--text-primary)',
                'content-secondary': 'var(--text-secondary)',
              },
              primary: {
                DEFAULT: 'rgb(var(--accent) / <alpha-value>)',
                hover: 'rgb(var(--accent-hover) / <alpha-value>)',
              },
            }
          }
        },
        daisyui: {
          themes: false,
        },
      }
    </script>
    
    <style>
      :root {
        --bg-primary: #ffffff;
        --bg-secondary: #f3f4f6;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --accent: 31 122 110;
        --accent-hover: 24 96 85;
      }

      html.dark {
        --bg-primary: #0b1220;
        --bg-secondary: #1e293b;
        --text-primary: #e5e7eb;
        --text-secondary: #9ca3af;
        --accent: 31 122 110;
        --accent-hover: 24 96 85;
      }

      html, body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      
      ::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }

      *:focus-visible {
        outline: none;
      }

      /* Markdown content styles */
      .markdown-content {
        word-wrap: break-word;
        overflow-wrap: break-word;
      }

      .markdown-content * {
        max-width: 100%;
      }

      /* Ensure markdown content in chat bubbles doesn't overflow */
      .chat-bubble .markdown-content {
        overflow: visible;
      }

      /* Code block styling in dark mode */
      html.dark .markdown-content code {
        background-color: rgba(0, 0, 0, 0.3);
      }

      /* Table styling */
      .markdown-content table {
        font-size: 0.9em;
      }

      /* List styling */
      .markdown-content ul,
      .markdown-content ol {
        padding-left: 1.5rem;
      }
    </style>
    
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
