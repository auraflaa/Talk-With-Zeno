<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Talk with Zeno</title>
    
    <!-- Fonts: Inter & Bricolage Grotesque -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- DaisyUI + Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
      :root {
        /* Light Mode Variables */
        --bg-primary: #ffffff;
        --bg-secondary: #f3f4f6;
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        
        /* Brand Accent: #1f7a6e (RGB: 31, 122, 110) */
        --accent: 31 122 110; 
        /* Hover Darker: #186055 (RGB: 24, 96, 85) */
        --accent-hover: 24 96 85;
      }

      html.dark {
        /* Dark Mode Variables */
        --bg-primary: #0b1220; /* Deep blue-black */
        --bg-secondary: #1e293b;
        --text-primary: #e5e7eb;
        --text-secondary: #9ca3af;
        
        /* Accent remains the same in Dark Mode */
        --accent: 31 122 110; 
        --accent-hover: 24 96 85; 
      }

      html, body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden; /* STRICT: Disable horizontal scroll globally */
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      
      /* STRICT SCROLLBAR HIDING - GLOBAL */
      * {
        scrollbar-width: none !important; /* Firefox */
        -ms-overflow-style: none !important; /* IE/Edge */
      }
      
      /* Chrome, Safari, Opera */
      ::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }

      /* Global Focus Ring Override */
      *:focus-visible {
        outline: none;
      }
    </style>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['"Bricolage Grotesque"', 'sans-serif'],
            },
            colors: {
              base: {
                100: 'var(--bg-primary)',
                200: 'var(--bg-secondary)',
                content: 'var(--text-primary)',
                'content-secondary': 'var(--text-secondary)',
              },
              primary: {
                DEFAULT: 'rgb(var(--accent) / <alpha-value>)',
                hover: 'rgb(var(--accent-hover) / <alpha-value>)',
              },
              // Override indigo/violet defaults to prevent accidental usage
              indigo: {
                 50: 'rgb(var(--bg-secondary))',
                 500: 'rgb(var(--accent))',
                 600: 'rgb(var(--accent-hover))',
              },
              violet: {
                 50: 'rgb(var(--bg-secondary))',
                 500: 'rgb(var(--accent))',
                 600: 'rgb(var(--accent-hover))',
              }
            }
          }
        },
        // Disable DaisyUI themes to prevent conflicts with manual class strategy
        daisyui: {
          themes: false, 
        },
      }
    </script>
    
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
