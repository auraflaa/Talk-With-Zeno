services:
  - type: web
    name: talk-with-zeno-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_DEBUG
        value: False
      - key: HOST
        value: 0.0.0.0

